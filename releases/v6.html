<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Low Pressure</title>
<meta name="description" content="A pixel-art desk by a rainy city window. Mix rain, wind, thunder and birds from the old monitor on the desk, or let the weather run itself.">
<meta name="theme-color" content="#0b0c1d">
<meta property="og:type" content="website">
<meta property="og:title" content="Low Pressure">
<meta property="og:description" content="A pixel-art desk by a rainy city window. Mix rain, wind, thunder and birds from the old monitor on the desk, or let the weather run itself.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230b0c1d'/%3E%3Crect x='2' y='1' width='3' height='1' fill='%239df2cf'/%3E%3Crect x='1' y='2' width='6' height='2' fill='%239df2cf'/%3E%3Crect x='2' y='5' width='1' height='1' fill='%23c6d6ff'/%3E%3Crect x='4' y='6' width='1' height='1' fill='%23c6d6ff'/%3E%3Crect x='6' y='5' width='1' height='1' fill='%23c6d6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: one full-bleed pixel scene on a canvas. Every control lives on the CRT monitor
   on the desk, laid out in --u (1% of the monitor's screen width) so it scales with the art. */
:root {
  color-scheme: dark;
  --night: #0b0c1d;        /* page ground: the room's deepest shadow */
  --screen: #071419;       /* CRT glass */
  --phos: #9df2cf;         /* phosphor text */
  --phos-hi: #e4fff4;      /* slider thumbs, live readouts */
  --phos-dim: #5aa893;
  --phos-faint: #1b4541;
  --phos-glow: rgba(157, 242, 207, .5);
  --hot: #ff7d9c;          /* lightning */
  --hot-faint: rgba(255, 125, 156, .2);
  --warm: #ffc56b;         /* lamp light */
  --standby: #b0683c;      /* power light when the monitor is off */
  --bezel-hi: #928dab;     /* monitor keys */
  --bezel-top: #a39ebb;
  --bezel-lo: #514c68;
  --bezel-ink: #1d1a30;
  --key-lit: #2c2a40;
  --led-off: #3a3650;
  --void: #000;
  --off-zone: #6b3348;     /* the stop at the far left of a slider that switches it off */
  --scan: rgba(0, 0, 0, .26);
  --tube-edge: rgba(0, 0, 0, .42);
  --display: "Pixelify Sans", "Courier New", monospace;
  --data: "VT323", "Courier New", monospace;
  --u: 3px;                /* set from script */
  --s: 3px;                /* one art pixel, set from script */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
html { height: 100%; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--phos); font-family: var(--display); overflow: hidden; }

#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
#scene { position: absolute; left: 0; top: 0; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }

/* ---- the monitor ---- */
#crt {
  position: absolute; z-index: 3; left: 0; top: 0; width: 300px; height: 250px;
  color: var(--phos); font-size: calc(var(--u) * 4.2); line-height: 1;
  text-shadow: 0 0 calc(var(--u) * 1.4) var(--phos-glow);
}
#crt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--s) - 1px), var(--scan) calc(var(--s) - 1px), var(--scan) var(--s)),
    radial-gradient(ellipse at 50% 45%, transparent 58%, var(--tube-edge) 100%);
}
.panel { position: absolute; inset: 0; }
.panel.under { visibility: hidden; pointer-events: none; }
.crt-in {
  display: flex; flex-direction: column; justify-content: space-between;
  gap: calc(var(--u) * 1);
  padding: calc(var(--u) * 3.2) calc(var(--u) * 4.5) calc(var(--u) * 3.6);
  overflow: hidden auto; scrollbar-width: none;
}
.crt-in::-webkit-scrollbar { display: none; }
#crt.waking .panel { animation: crt-on .24s steps(6); }
#crt.jolt .panel { animation: jolt .45s steps(1); }
#crt.is-off { cursor: pointer; }
#crt.is-off::after { opacity: 0; }
#crt.is-off .panel { animation: crt-off .34s steps(8) forwards; pointer-events: none; }
#crt.is-off.cold .panel { animation: none; visibility: hidden; }
@keyframes crt-on {
  0% { transform: scale(1, .012); filter: brightness(3); }
  60% { transform: none; filter: brightness(1.6); }
}
@keyframes crt-off {
  0% { transform: none; filter: none; }
  55% { transform: scale(1, .012); filter: brightness(4); }
  99% { transform: scale(0, .012); filter: brightness(4); }
  100% { transform: scale(0, .012); visibility: hidden; }
}
@keyframes jolt {
  0% { opacity: .35; transform: translateX(calc(var(--u) * .8)); }
  18% { opacity: 1; transform: none; }
  34% { opacity: .6; }
  50% { opacity: 1; }
}

.hd { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.hd h1 { margin: 0 auto 0 0; font-size: calc(var(--u) * 5.4); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.hd .sl { flex: 0 1 calc(var(--u) * 26); width: calc(var(--u) * 26); }

.ctl { display: grid; gap: calc(var(--u) * .3); }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u) * 2); }
.top label { font-size: calc(var(--u) * 4.2); letter-spacing: .14em; text-transform: uppercase; }
.top output { font-family: var(--data); font-size: calc(var(--u) * 5.6); color: var(--phos-hi); white-space: nowrap; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * 3); align-items: center; }

.sl {
  -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0;
  height: calc(var(--u) * 6.4); margin: 0; padding: 0; background: transparent; cursor: pointer; --p: 50%;
}
.sl::-webkit-slider-runnable-track {
  height: calc(var(--u) * 3);
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 3)),
    linear-gradient(90deg, var(--phos) 0, var(--phos) var(--p), var(--phos-faint) var(--p), var(--phos-faint) 100%);
}
.sl::-moz-range-track {
  height: calc(var(--u) * 3);
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 3)),
    linear-gradient(90deg, var(--phos) 0, var(--phos) var(--p), var(--phos-faint) var(--p), var(--phos-faint) 100%);
}
/* weather sliders start with a short stop that switches the channel off */
.sl.ch::-webkit-slider-runnable-track {
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 3)),
    linear-gradient(90deg, var(--off-zone) 0, var(--off-zone) 4.76%, var(--phos) 4.76%, var(--phos) var(--p), var(--phos-faint) var(--p), var(--phos-faint) 100%);
}
.sl.ch::-moz-range-track {
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 2.2), var(--screen) calc(var(--u) * 3)),
    linear-gradient(90deg, var(--off-zone) 0, var(--off-zone) 4.76%, var(--phos) 4.76%, var(--phos) var(--p), var(--phos-faint) var(--p), var(--phos-faint) 100%);
}
.ctl.is-off label, .ctl.is-off output { color: var(--phos-dim); }
.ctl.is-off .sl::-webkit-slider-thumb { background: var(--phos-dim); box-shadow: none; }
.ctl.is-off .sl::-moz-range-thumb { background: var(--phos-dim); box-shadow: none; }
.sl::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: calc(var(--u) * 2); height: calc(var(--u) * 6.4);
  margin-top: calc(var(--u) * -1.7); border: 0; border-radius: 0; background: var(--phos-hi);
  box-shadow: 0 0 calc(var(--u) * 2) var(--phos-glow);
}
.sl::-moz-range-thumb {
  width: calc(var(--u) * 2); height: calc(var(--u) * 6.4); border: 0; border-radius: 0; background: var(--phos-hi);
  box-shadow: 0 0 calc(var(--u) * 2) var(--phos-glow);
}

.btn {
  font: inherit; font-size: calc(var(--u) * 4.2); letter-spacing: .08em; text-transform: uppercase;
  height: calc(var(--u) * 7.2); padding: 0 calc(var(--u) * 2.4); margin: 0;
  color: var(--phos); background: transparent; border: calc(var(--u) * .5) solid var(--phos-dim); border-radius: 0;
  text-shadow: inherit; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--phos-faint); border-color: var(--phos); }
.btn:active, .btn[aria-pressed="true"] { background: var(--phos); border-color: var(--phos); color: var(--screen); text-shadow: none; }
.btn.hot { color: var(--hot); border-color: var(--hot); }
.btn.hot:hover { background: var(--hot-faint); }
.btn.hot:active { background: var(--hot); color: var(--screen); }
.btn.nudge { animation: nudge 1.3s steps(1) infinite; }
@keyframes nudge { 50% { background: var(--phos-faint); border-color: var(--phos-hi); color: var(--phos-hi); } }

.presets, .autorow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--u) * 1.6); align-items: center; }
.autorow .lbl { font-size: calc(var(--u) * 4.2); letter-spacing: .14em; text-transform: uppercase; }
.presets .btn, .autorow .btn { padding: 0; font-size: calc(var(--u) * 3.6); letter-spacing: .02em; height: calc(var(--u) * 6.6); }

/* ---- video on the monitor ---- */
#videoPanel { display: flex; flex-direction: column; }
.tune { display: flex; align-items: center; gap: calc(var(--u) * 1.6); padding: calc(var(--u) * 2.6) calc(var(--u) * 3.4) calc(var(--u) * 2.2); }
.tune input {
  flex: 1; min-width: 0; height: calc(var(--u) * 7.2); margin: 0; padding: 0 calc(var(--u) * 1.2);
  font-family: var(--data); font-size: calc(var(--u) * 5.2); color: var(--phos-hi); text-shadow: inherit;
  background: transparent; border: 0; border-bottom: calc(var(--u) * .5) solid var(--phos-dim); border-radius: 0;
}
.tune input::placeholder { color: var(--phos-dim); opacity: 1; }
.tune input[aria-invalid="true"] { border-color: var(--hot); color: var(--hot); }
.tube { position: relative; flex: 1; min-height: 0; }
.tube iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--void); }
.nosignal {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 2.6); padding: 0 calc(var(--u) * 5) calc(var(--u) * 3); text-align: center;
}
.nosignal p { margin: 0; font-family: var(--data); font-size: calc(var(--u) * 5.2); line-height: 1.05; text-wrap: balance; }
.nosignal .big { font-size: calc(var(--u) * 11); letter-spacing: .06em; color: var(--phos-hi); }
.nosignal .warn { color: var(--warm); }
.stations { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1.6); }
.stations .btn { font-size: calc(var(--u) * 3.6); padding: 0 calc(var(--u) * 2); letter-spacing: .04em; }

/* ---- keys on the monitor's bezel ---- */
#chin {
  position: absolute; z-index: 3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start;
  gap: calc(var(--s) * 2); padding: 0 calc(var(--s) * 2); font-size: max(9px, calc(var(--u) * 3.3));
}
.key {
  display: flex; align-items: center; justify-content: center; gap: calc(var(--s) * 1.5); min-width: 0;
  height: calc(var(--s) * 7); margin: 0; padding: 0 0 var(--s);
  font: inherit; line-height: 1; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  color: var(--bezel-ink); background: var(--bezel-hi); border: 0; border-radius: 0;
  box-shadow: inset 0 calc(var(--s) * -1) 0 var(--bezel-lo); cursor: pointer;
}
.key:hover { background: var(--bezel-top); }
.key:not(.power)[aria-pressed="true"] {
  transform: translateY(var(--s)); padding-bottom: 0; color: var(--phos); background: var(--key-lit);
  box-shadow: inset 0 var(--s) 0 var(--bezel-ink);
}
.led { display: block; width: calc(var(--s) * 2); height: var(--s); background: var(--led-off); }
#keyVideo.live .led { background: var(--hot); box-shadow: 0 0 calc(var(--s) * 2) var(--hot); }
#keyPower .led { background: var(--standby); }
#keyPower[aria-pressed="true"] .led { background: var(--phos); box-shadow: 0 0 calc(var(--s) * 2) var(--phos-glow); }
.key:focus-visible { outline: 2px solid var(--phos-hi); outline-offset: 1px; }
.tune input:focus-visible { outline: calc(var(--u) * .5) solid var(--phos-hi); outline-offset: calc(var(--u) * .6); }

/* ---- things in the room you can touch ---- */
.hit { position: absolute; z-index: 2; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
.btn:focus-visible, .sl:focus-visible { outline: calc(var(--u) * .5) solid var(--phos-hi); outline-offset: calc(var(--u) * .6); }
.hit:focus-visible { outline: 2px dashed var(--warm); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .btn.nudge, #crt.jolt .panel, #crt.waking .panel { animation: none; }
  #crt.is-off .panel { animation: none; visibility: hidden; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" role="img" aria-label="Pixel-art desk at night, looking out a window at a rainy city. A cat sleeps on top of an old monitor."></canvas>

  <section id="crt" aria-label="Monitor screen">
    <div class="panel crt-in" id="weatherPanel">
      <div class="hd">
        <h1>Low Pressure</h1>
        <input class="sl" id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Volume" title="Volume">
        <button class="btn nudge sound-toggle" id="sound" type="button" aria-pressed="false">Sound</button>
      </div>

      <div class="ctl">
        <div class="top"><label for="rain">Rain</label><output id="rainOut" for="rain"></output></div>
        <input class="sl ch" id="rain" type="range" min="0" max="105" step="1" value="63">
      </div>

      <div class="ctl">
        <div class="top"><label for="wind">Wind</label><output id="windOut" for="wind"></output></div>
        <input class="sl ch" id="wind" type="range" min="0" max="105" step="1" value="37">
      </div>

      <div class="ctl">
        <div class="top"><label for="thunder">Thunder</label><output id="thunderOut" for="thunder"></output></div>
        <div class="row">
          <input class="sl ch" id="thunder" type="range" min="0" max="105" step="1" value="40">
          <button class="btn hot" id="strike" type="button">Strike</button>
        </div>
      </div>

      <div class="ctl">
        <div class="top"><label for="birds">Birds</label><output id="birdsOut" for="birds"></output></div>
        <input class="sl ch" id="birds" type="range" min="0" max="105" step="1" value="25">
      </div>

      <div class="autorow" role="group" aria-labelledby="autoLbl">
        <span class="lbl" id="autoLbl">Auto</span>
        <button class="btn" type="button" data-auto="off" aria-pressed="false" title="The weather stays where you set it">Off</button>
        <button class="btn" type="button" data-auto="cycle" aria-pressed="true" title="Tours the presets from Clear up to Tempest and back">Cycle</button>
        <button class="btn" type="button" data-auto="natural" aria-pressed="false" title="Free-running weather that builds and eases as it pleases">Natural</button>
      </div>

      <div class="presets" role="group" aria-label="Weather presets">
        <button class="btn" type="button" data-preset="clear" aria-pressed="false">Clear</button>
        <button class="btn" type="button" data-preset="drizzle" aria-pressed="false">Drizzle</button>
        <button class="btn" type="button" data-preset="steady" aria-pressed="false">Steady</button>
        <button class="btn" type="button" data-preset="tempest" aria-pressed="false">Tempest</button>
      </div>
    </div>

    <div class="panel crt-in" id="mixPanel" hidden>
      <div class="hd">
        <h1>Volume mix</h1>
        <button class="btn nudge sound-toggle" type="button" aria-pressed="false">Sound</button>
      </div>

      <div class="ctl">
        <div class="top"><label for="mixMaster">Master</label><output id="mixMasterOut" for="mixMaster"></output></div>
        <input class="sl" id="mixMaster" type="range" min="0" max="100" step="1" value="70">
      </div>

      <div class="ctl">
        <div class="top"><label for="mixRain">Rain</label><output id="mixRainOut" for="mixRain"></output></div>
        <input class="sl" id="mixRain" type="range" min="0" max="100" step="1" value="75">
      </div>

      <div class="ctl">
        <div class="top"><label for="mixWind">Wind</label><output id="mixWindOut" for="mixWind"></output></div>
        <input class="sl" id="mixWind" type="range" min="0" max="100" step="1" value="75">
      </div>

      <div class="ctl">
        <div class="top"><label for="mixThunder">Thunder</label><output id="mixThunderOut" for="mixThunder"></output></div>
        <input class="sl" id="mixThunder" type="range" min="0" max="100" step="1" value="75">
      </div>

      <div class="ctl">
        <div class="top"><label for="mixBirds">Birds</label><output id="mixBirdsOut" for="mixBirds"></output></div>
        <input class="sl" id="mixBirds" type="range" min="0" max="100" step="1" value="75">
      </div>
    </div>

    <div class="panel under" id="videoPanel">
      <form class="tune" id="tune">
        <label class="vh" for="yt">YouTube link</label>
        <input id="yt" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste a YouTube link">
        <button class="btn" type="submit">Load</button>
        <button class="btn hot" type="button" id="ytStop" hidden>Stop</button>
      </form>
      <div class="tube" id="tube">
        <div class="nosignal" id="noSignal">
          <p class="big">No signal</p>
          <p id="ytMsg" role="status">Paste a link above, or pick a station.</p>
          <div class="stations">
            <button class="btn" type="button" data-yt="rFZHOHl-L8A">Lofi radio</button>
            <button class="btn" type="button" data-yt="4xDzrJKXOOY">Synthwave</button>
            <button class="btn" type="button" data-yt="U3n31M81RpE" data-loop>Smooth jazz</button>
            <button class="btn" type="button" data-yt="MzJjzEEphfM" data-loop>ODST rain</button>
            <button class="btn" type="button" data-yt="7bW75OwVXZI" data-loop>L.A. Noire</button>
            <button class="btn" type="button" data-yt="cdKop6aixVE" data-loop>Fireplace</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="chin" role="group" aria-label="Monitor buttons">
    <button class="key" id="keyWeather" type="button" aria-pressed="true">Weather</button>
    <button class="key" id="keyVideo" type="button" aria-pressed="false"><i class="led" aria-hidden="true"></i>Video</button>
    <button class="key" id="keyMix" type="button" aria-pressed="false" title="Volume for each sound">Volume</button>
    <button class="key power" id="keyPower" type="button" aria-pressed="true" aria-label="Monitor power"><i class="led" aria-hidden="true"></i>Power</button>
  </div>

  <button class="hit" id="lampBtn" type="button" aria-pressed="true" aria-label="Desk lamp" title="Switch the lights"></button>
  <button class="hit" id="lightsBtn" type="button" aria-pressed="true" aria-label="String lights" title="Switch the lights"></button>
  <button class="hit" id="catBtn" type="button" aria-pressed="false" aria-label="Pet the cat" title="Pet the cat"></button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const root = document.documentElement, stage = $('stage'), cv = $('scene'), ctx = cv.getContext('2d');
const crt = $('crt'), lampBtn = $('lampBtn'), lightsBtn = $('lightsBtn'), catBtn = $('catBtn'), soundBtns = document.querySelectorAll('.sound-toggle');
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------ settings */
const KEY = 'lowpressure.v1', OLD_KEY = 'stormwindow.v1';   // settings saved under the app's earlier name are still read
const SLIDERS = ['rain', 'wind', 'thunder', 'birds', 'volume'], CH = ['rain', 'wind', 'thunder', 'birds'];
const cap = k => k[0].toUpperCase() + k.slice(1);
// A mix slider at 75 is the level the effect was designed at; the top of the slider is about 1.6 times that.
const mixGain = k => Math.pow(T.mix[k] / 75, 1.6);

  if (T.auto === 'cycle') {
    let best = 0;                                              // join the tour at the stop nearest the rain as it stands, on the way up
    if (!fromClear) for (let i = 1; i < 4; i++) if (Math.abs(PRESETS[TOUR[i]].rain - T.rain) < Math.abs(PRESETS[TOUR[best]].rain - T.rain)) best = i;
    auto.stop = best; auto.birdBase = .35;
    auto.t0 = now - (fromClear ? (DWELL.clear - 15) * 1000 : 0);     // on loading, Clear gets a short look before the build begins
  } else {
    seedNatural(now);
    auto.until = now + (25 + Math.random() * 30) * 1000;       // the first change comes soon
  }
}
function cycleTargets(now) {
  let e = (now - auto.t0) / 1000;
  if (e >= DWELL[TOUR[auto.stop]] + GLIDE) { auto.stop = (auto.stop + 1) % TOUR.length; auto.t0 = now; e = 0; }
  const rest = DWELL[TOUR[auto.stop]];
  const a = PRESETS[TOUR[auto.stop]], b = PRESETS[TOUR[(auto.stop + 1) % TOUR.length]];
  auto.dwelling = e < rest;
  if (auto.dwelling) return { rain: a.rain, wind: a.wind, thunder: a.thunder };
  const u = (e - rest) / GLIDE, w = GLIDE_WINDOW[b.rain > a.rain ? 'up' : 'down'], out = {};
  for (const k of ['rain', 'wind', 'thunder']) { const x = clamp((u - w[k][0]) / (w[k][1] - w[k][0]), 0, 1); out[k] = a[k] + (b[k] - a[k]) * x * x * (3 - 2 * x); }
  return out;
}
function naturalTargets(now, dt, t) {
  if (now >= auto.until) {
    if (auto.level === 0) auto.rising = true; else if (auto.level === 3) auto.rising = false; else if (Math.random() < .3) auto.rising = !auto.rising;
    if (auto.level === 0 || auto.level === 3 || Math.random() > .15) auto.level += auto.rising ? 1 : -1;   // else the same spell carries on at a new strength
    drawSpell(now);
  }
  auto.lead += (auto.target - auto.lead) * (1 - Math.exp(-dt / 22));
  auto.s += (auto.lead - auto.s) * (1 - Math.exp(-dt / 30));
  auto.wind += (auto.windTarget - auto.wind) * (1 - Math.exp(-dt / 18));        // quicker than the rain, so wind arrives first
  auto.th += (auto.thTarget - auto.th) * (1 - Math.exp(-dt / 25));
  const x = auto.s + (.035 * Math.sin(t / 31) + .025 * Math.sin(t / 11.3 + 1)) * Math.min(1, auto.s * 6);
  return {
    rain: (x < .1 ? 0 : Math.pow((x - .1) / .9, 1.15)) * 100,
    wind: clamp(auto.wind + (.03 + .13 * auto.wind) * (Math.sin(t / 47) + .45 * Math.sin(t / 15.1 + 2)), 0, 1) * 100,   // still air stays still
    thunder: (auto.th < .02 ? 0 : clamp(auto.th * (1 + .12 * Math.sin(t / 23 + 4)), 0, 1)) * 100
  };
}
function autoStep(now) {
  const dt = Math.min(5, (now - auto.last) / 1000), t = now / 1000 + auto.ph;
  auto.last = now;
  const tg = T.auto === 'cycle' ? cycleTargets(now) : naturalTargets(now, dt, t);
  // Birds only sing while it is clear: no rain at all and no more than a far-off grumble of thunder. They answer
  // to the weather that is actually playing, so a switched-off slider never silences them. They go quiet within
  // seconds of the first rain, come back over half a minute once it is dry, and are liveliest just after rain.
  const clear = T.rain === 0 && T.thunder < 10;
  const stress = clamp(Math.max((T.wind / 100 - .4) * 1.7, T.thunder / 100 * 3), 0, 1);
  auto.afterRain = clear ? Math.max(0, auto.afterRain - dt / 150) : 1;
  const want = clear ? clamp(auto.birdBase * (1 + .5 * auto.afterRain), 0, 1) * Math.pow(1 - stress, 1.5) : 0;
  auto.birds += (want - auto.birds) * (1 - Math.exp(-dt / (want < auto.birds ? 7 : 30)));
  tg.birds = auto.birds * 100;
  let changed = false;
  for (const k of CH) {
    if (T.off[k] || now < auto.hold[k]) continue;
    const step = RATE[k] * dt;
    auto.v[k] += clamp(tg[k] - auto.v[k], -step, step);
    const n = Math.round(auto.v[k]);
    if (T[k] !== n) { T[k] = n; changed = true; }
  }
  const at = T.auto === 'cycle' && auto.dwelling ? TOUR[auto.stop] : null;
  if (at !== auto.at) { auto.at = at; changed = true; }
  if (changed) { refresh(); if (now - auto.saved > 15000) { auto.saved = now; save(); } }
}
// A slider moved by hand while auto is running: auto leaves it alone for a moment, then carries on from there.
function autoNudge(k) {
  const now = performance.now();
  auto.v[k] = T[k];
  auto.hold[k] = now + (T.auto === 'cycle' ? 25000 : 6000);
  if (k === 'birds') { auto.birds = T.birds / 100; if (T.auto === 'natural') auto.birdBase = clamp(T.birds / 100, .1, .6); }
  if (T.auto !== 'natural') return;
  if (k === 'rain') { const s0 = stormOf(T.rain / 100); auto.s = auto.lead = auto.target = s0; auto.level = levelOf(s0); auto.until = now + between(SPELLS[auto.level].secs) * 1000; }
  else if (k === 'wind') auto.wind = auto.windTarget = T.wind / 100;
  else if (k === 'thunder') auto.th = auto.thTarget = T.thunder / 100;
}
// A preset pressed while auto is running: the tour jumps to that stop, or the free-running weather restarts from it.
function autoPreset(name) {
  const now = performance.now();
  for (const k of CH) auto.v[k] = T[k];
  if (T.auto === 'cycle') { auto.stop = TOUR.indexOf(name); auto.t0 = now; for (const k of CH) auto.hold[k] = 0; }
  else { seedNatural(now); auto.until = now + between(SPELLS[auto.level].secs) * 1000; }
}
function setAuto(mode) {
  if (mode === T.auto) return;
  T.auto = mode;
  if (mode !== 'off') autoStart(false);
  save(); refresh();
}

function tick() {
  const now = performance.now(), t = now / 1000;
  if (T.auto !== 'off') autoStep(now);
  if (T.thunder > 0) {
    if (!isFinite(nextStrike)) planStrike(true);
    if (now >= nextStrike) { strike(); planStrike(false); }
  } else nextStrike = Infinity;
  readouts();
  if (!audible()) return;
  const at = ac.currentTime, r = T.rain / 100, w = T.wind / 100, gu = gustAt(t), lash = 1 + .4 * w * gu;
  const set = (p, v, tc) => p.setTargetAtTime(v, at, tc || .35);
  set(A.master.gain, masterLevel(), .12);
  const mRain = mixGain('rain'), mWind = mixGain('wind');
  set(A.hiss.gain, Math.pow(r, 1.3) * .5 * lash * mRain);
  set(A.body.gain, r * r * .22 * lash * mRain);
  set(A.low.gain, Math.pow(r, 1.7) * .55 * mRain);
  set(A.drops.gain, mRain, .1);
  set(A.windG.gain, Math.pow(w, 1.2) * (.18 + .95 * gu * gu) * mWind);
  set(A.windF.frequency, 190 + 90 * w + 430 * w * gu, .5);
  set(A.howlG.gain, Math.pow(w, 2.4) * (.03 + .5 * gu * gu * gu) * mWind);
  set(A.howlF.frequency, 520 + 620 * w * gu + 70 * Math.sin(t * .7), .45);
  set(A.purr.gain, purring ? .5 + .25 * Math.sin(t * 2.4) : 0, .25);
  set(A.th.gain, mixGain('thunder'), .1);
  set(A.birds.gain, mixGain('birds'), .1);
  if (r > .005) {
    if (nextDrop < at) nextDrop = at + Math.random() * .05;
    const rate = 1.2 + r * r * 24;
    while (nextDrop < at + 1.2) { drop(nextDrop, r); nextDrop += -Math.log(1 - Math.random()) / rate; }
  } else nextDrop = at;
  const b = T.birds / 100;
  if (b > .005) {
    if (nextBird < at) nextBird = at + Math.random() * .6;
    const rate = .04 + b * b * .85;                                              // phrases per second
    while (nextBird < at + 1.2) { birdPhrase(nextBird, b); nextBird += -Math.log(1 - Math.random()) / rate; }
  } else nextBird = at;
}

/* ------------------------------------------------------------ controls */
const BEAUFORT = [[1, 'calm'], [6, 'light air'], [12, 'light breeze'], [20, 'gentle breeze'], [29, 'moderate breeze'], [39, 'fresh breeze'], [50, 'strong breeze'], [62, 'near gale'], [75, 'gale'], [89, 'strong gale'], [Infinity, 'storm']];
function rainText() {
  const mm = Math.pow(T.rain / 100, 2) * 50;
  if (T.off.rain) return 'off';
  if (!T.rain) return 'dry';
  const name = mm < .5 ? 'drizzle' : mm < 2.5 ? 'light' : mm < 7.6 ? 'moderate' : mm < 25 ? 'heavy' : 'torrential';
  return mm.toFixed(mm < 10 ? 1 : 0) + ' mm/h · ' + name;
}
function windText() {
  const kmh = Math.round(T.wind * .95);
  if (T.off.wind) return 'off';
  return kmh + ' km/h · ' + BEAUFORT.find(b => kmh < b[0])[1];
}
function thunderText() {
  if (lastStrike && performance.now() - lastStrike.at < 6000) return 'strike ' + lastStrike.km.toFixed(1) + ' km away';
  return T.off.thunder ? 'off' : T.thunder ? 'every ~' + Math.round(meanGap()) + ' s' : 'none';
}
const setText = (id, s) => { const el = $(id); if (el.textContent !== s) el.textContent = s; };
const birdsText = () => T.off.birds ? 'off' : !T.birds ? 'none' : T.birds < 25 ? 'a call now and then' : T.birds < 50 ? 'a few about' : T.birds < 75 ? 'busy' : 'dawn chorus';
function readouts() {
  const s = thunderText();
  setText('thunderOut', s); $('thunder').setAttribute('aria-valuetext', s);
}
function refresh() {
  // Weather sliders run 0 to 105: the first five steps are the off stop, and 5 to 105 is the value 0 to 100.
  for (const k of SLIDERS) {
    const el = $(k), ch = k !== 'volume', off = ch && T.off[k], want = ch ? (off ? 0 : T[k] + 5) : T[k];
    if (off ? +el.value >= 5 : +el.value !== want) el.value = want;      // inside the off stop, leave the thumb where the hand put it
    el.style.setProperty('--p', (ch ? want / 1.05 : want) + '%');
    if (ch) el.closest('.ctl').classList.toggle('is-off', off);
  }
  for (const [k, s] of [['rain', rainText()], ['wind', windText()], ['birds', birdsText()]]) { setText(k + 'Out', s); $(k).setAttribute('aria-valuetext', s); }
  $('volume').setAttribute('aria-valuetext', T.volume + '%');
  readouts();
  const waiting = soundOn && !audible();
  for (const b of soundBtns) { b.setAttribute('aria-pressed', String(soundOn)); b.classList.toggle('nudge', waiting); b.title = waiting ? 'Sound is on. Click anywhere to let the browser start it.' : ''; }
  const pct = (id, v, text) => { const el = $(id); if (+el.value !== v) el.value = v; el.style.setProperty('--p', v + '%'); el.setAttribute('aria-valuetext', text); setText(id + 'Out', text); };
  pct('mixMaster', T.volume, T.volume ? T.volume + '%' : 'muted');
  for (const k of CH) pct('mix' + cap(k), T.mix[k], T.mix[k] ? Math.round(mixGain(k) * 100) + '%' : 'muted');
  for (const b of document.querySelectorAll('[data-preset]')) {
    const p = PRESETS[b.dataset.preset];
    const same = ['rain', 'wind', 'thunder'].every(k => T.off[k] || p[k] === T[k]);
    b.setAttribute('aria-pressed', String(T.auto === 'cycle' ? auto.at === b.dataset.preset : same));   // on the tour, the lit preset is the one being shown
  }
  for (const b of document.querySelectorAll('[data-auto]')) b.setAttribute('aria-pressed', String(T.auto === b.dataset.auto));
  lampBtn.setAttribute('aria-pressed', String(T.lamp)); lightsBtn.setAttribute('aria-pressed', String(T.lamp));
  catBtn.setAttribute('aria-pressed', String(purring));
}

for (const k of SLIDERS) $(k).addEventListener('input', e => {
  const raw = Math.round(+e.target.value);
  if (k === 'volume') T.volume = clamp(raw, 0, 100);
  else {
    T.off[k] = raw < 5; T[k] = clamp(raw - 5, 0, 100);
    if (T.auto !== 'off') autoNudge(k);
  }
  if (k === 'thunder') planStrike(true);
  save(); refresh();
});
// With the arrow keys the off stop is one press wide: step into it from 0, and back out to 0.
for (const k of CH) $(k).addEventListener('keydown', e => {
  const el = e.target, raw = +el.value;
  if ((e.key === 'ArrowRight' || e.key === 'ArrowUp') && raw < 5) el.value = 4;
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowDown') && raw === 5) el.value = 1;
});
for (const b of document.querySelectorAll('[data-preset]')) b.addEventListener('click', () => {
  const p = PRESETS[b.dataset.preset];
  for (const k of ['rain', 'wind', 'thunder']) if (!T.off[k]) T[k] = p[k];
  if (T.auto !== 'off') autoPreset(b.dataset.preset);
  if (T.thunder) planStrike(true);
  save(); refresh();
});
for (const b of document.querySelectorAll('[data-auto]')) b.addEventListener('click', () => setAuto(b.dataset.auto));
$('strike').addEventListener('click', () => strike(.8 + Math.random() * 1.2));
for (const b of soundBtns) b.addEventListener('click', () => {
  if (blockedAtPress) { blockedAtPress = false; return; }      // this press was the one that let the waiting sound start
  T.sound = !soundOn; save(); setSound(T.sound);
});
$('mixMaster').addEventListener('input', e => { T.volume = clamp(Math.round(+e.target.value), 0, 100); save(); refresh(); });
for (const k of CH) $('mix' + cap(k)).addEventListener('input', e => { T.mix[k] = clamp(Math.round(+e.target.value), 0, 100); save(); refresh(); if (soundOn) tick(); });
const toggleLamp = () => { T.lamp = !T.lamp; click(); save(); refresh(); };
lampBtn.addEventListener('click', toggleLamp); lightsBtn.addEventListener('click', toggleLamp);
catBtn.addEventListener('click', () => { purring = !purring; refresh(); if (soundOn) tick(); });

/* ------------------------------------------------------------ the monitor: weather, video, or off */
const weatherPanel = $('weatherPanel'), videoPanel = $('videoPanel'), tube = $('tube'), noSignal = $('noSignal'), ytMsg = $('ytMsg'), ytInput = $('yt'), ytStop = $('ytStop');
const keyWeather = $('keyWeather'), keyVideo = $('keyVideo'), keyMix = $('keyMix'), keyPower = $('keyPower'), mixPanel = $('mixPanel');
let shownMode = T.mode === 'off' ? 'weather' : T.mode, resumeVideo = false;

function parseYT(raw) {
  const s = String(raw || '').trim();
  if (/^[\w-]{11}$/.test(s)) return { v: s, list: null };
  try {
    const u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s), host = u.hostname.replace(/^(www|m|music)\./, '');
    let v = null, list = u.searchParams.get('list');
    if (host === 'youtu.be') v = u.pathname.slice(1).split('/')[0];
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      v = u.searchParams.get('v');
      if (!v) { const m = u.pathname.match(/^\/(?:embed|live|shorts|v)\/([\w-]{11})/); if (m) v = m[1]; }
    } else return null;
    if (v && !/^[\w-]{11}$/.test(v)) v = null;
    if (list && !/^[\w-]{10,64}$/.test(list)) list = null;
    return v || list ? { v, list } : null;
  } catch (e) { return null; }
}
function note(msg, warn) { ytMsg.textContent = msg; ytMsg.classList.toggle('warn', !!warn); }
function envNote() {
  if (ytBlocked) note('This viewer blocks embedded video. Open your local copy at http://localhost to watch it here.', true);
  else if (location.protocol === 'file:') note('YouTube will not play in a page opened as a file. Serve this folder and open it at http://localhost.', true);
  else note('Paste a link above, or pick a station.');
}
function syncMonitor() {
  crt.classList.toggle('is-off', T.mode === 'off');
  weatherPanel.hidden = shownMode !== 'weather';
  mixPanel.hidden = shownMode !== 'mix';
  videoPanel.classList.toggle('under', shownMode !== 'video');   // kept alive underneath so music plays on while you change the weather
  keyWeather.setAttribute('aria-pressed', String(T.mode === 'weather'));
  keyVideo.setAttribute('aria-pressed', String(T.mode === 'video'));
  keyMix.setAttribute('aria-pressed', String(T.mode === 'mix'));
  keyPower.setAttribute('aria-pressed', String(T.mode !== 'off'));
  keyVideo.classList.toggle('live', ytLoaded);
  noSignal.hidden = ytLoaded; ytStop.hidden = !ytLoaded;
}
function unloadVideo() {
  if (ytFrame) { ytFrame.remove(); ytFrame = null; }
  ytLoaded = false;
  syncMonitor();
}
function loadVideo(raw, autoplay, loop) {
  const p = parseYT(raw);
  if (!p) { ytInput.setAttribute('aria-invalid', 'true'); note('That is not a YouTube link. Paste the address of a video, live stream or playlist.', true); return false; }
  unloadVideo();
  // A single video repeats only when its own ID is also given as the playlist.
  const q = 'autoplay=' + (autoplay ? 1 : 0) + '&playsinline=1&rel=0' + (loop && p.v && !p.list ? '&loop=1&playlist=' + p.v : '');
  const f = document.createElement('iframe');
  f.title = 'YouTube player';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = p.v
    ? 'https://www.youtube.com/embed/' + p.v + '?' + q + (p.list ? '&list=' + encodeURIComponent(p.list) : '')
    : 'https://www.youtube.com/embed/videoseries?list=' + encodeURIComponent(p.list) + '&' + q;
  tube.appendChild(f);
  ytFrame = f; ytLoaded = true;
  T.yt = String(raw).trim().slice(0, 300); T.ytLoop = !!loop; save();
  ytInput.removeAttribute('aria-invalid');
  envNote(); syncMonitor();
  return true;
}
function setMode(m) {
  if (m === T.mode) return;
  const waking = T.mode === 'off';
  if (m === 'off') { resumeVideo = ytLoaded; unloadVideo(); }
  else {
    shownMode = m;
    if (waking && resumeVideo && T.yt) loadVideo(T.yt, true, T.ytLoop);
    resumeVideo = false;
    crt.classList.remove('cold', 'waking'); void crt.offsetWidth; crt.classList.add('waking');
  }
  T.mode = m; save(); syncMonitor();
}
crt.addEventListener('animationend', e => { if (e.animationName === 'jolt' || e.animationName === 'crt-on') crt.classList.remove('jolt', 'waking'); });
keyWeather.addEventListener('click', () => setMode('weather'));
keyVideo.addEventListener('click', () => setMode('video'));
keyMix.addEventListener('click', () => setMode('mix'));
keyPower.addEventListener('click', () => setMode(T.mode === 'off' ? shownMode : 'off'));
crt.addEventListener('click', () => { if (T.mode === 'off') setMode(shownMode); });
$('tune').addEventListener('submit', e => { e.preventDefault(); if (ytBlocked) envNote(); else loadVideo(ytInput.value, true, false); });
ytInput.addEventListener('input', () => ytInput.removeAttribute('aria-invalid'));
ytStop.addEventListener('click', () => { unloadVideo(); envNote(); });
for (const b of document.querySelectorAll('[data-yt]')) b.addEventListener('click', () => {
  ytInput.value = 'https://www.youtube.com/watch?v=' + b.dataset.yt;
  if (ytBlocked) envNote(); else loadVideo(ytInput.value, true, b.hasAttribute('data-loop'));
});
// Some hosts refuse to embed other sites. Say so on the screen instead of leaving a blank player.
document.addEventListener('securitypolicyviolation', e => {
  if (!/frame-src|child-src|default-src/.test(e.effectiveDirective || e.violatedDirective || '') || !/youtube/i.test(e.blockedURI || '')) return;
  ytBlocked = true; unloadVideo(); envNote();
});
ytInput.value = T.yt;
if (T.mode === 'off') crt.classList.add('cold');
envNote();
if (T.mode === 'video' && T.yt && location.protocol !== 'file:') loadVideo(T.yt, false, T.ytLoop);
syncMonitor();

// Any click or key press anywhere on the page is enough for the browser to let waiting sound start.
function gesture(e) {
  const waiting = soundOn && !audible();
  if (e.type === 'pointerdown' || e.type === 'keydown') blockedAtPress = waiting;
  if (waiting && ac) { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); }
  else if (T.sound && !soundOn) setSound(true);
}
for (const ev of ['pointerdown', 'mousedown', 'touchend', 'keydown', 'click']) document.addEventListener(ev, gesture, true);

/* ------------------------------------------------------------ go */
let pending = 0;
const rebuild = () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); };
if (window.ResizeObserver) new ResizeObserver(rebuild).observe(stage); else addEventListener('resize', rebuild);
build();
if (T.auto === 'cycle') {                              // the tour always opens on Clear
  for (const k of ['rain', 'wind', 'thunder']) T[k] = T.off[k] ? 0 : PRESETS.clear[k];
  if (!T.off.birds) T.birds = 35;
  for (const k of CH) C[k] = T[k] / 100;
}
if (T.auto !== 'off') autoStart(T.auto === 'cycle');
refresh();
if (T.sound) setSound(true);
setInterval(tick, 200);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
